[project]
name = "clappy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "python-multipart>=0.0.20", "numpy>=2,<3", "scipy>=1.14,<2",
  "google-genai==2.22.0", "google-adk[mcp]==2.8.0", "clickhouse-connect>=0.8,<2",
  "opentimelineio>=0.18,<1",
  "PyYAML==6.0.3",
  "google-cloud-speech>=2,<3",
  "google-cloud-texttospeech>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
pythonpath = ["."]

[tool.uv]
package = false
